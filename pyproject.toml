# Assay — pyproject.toml
# Offline, deterministic sheet-audit platform. Reused spine from Signoff 0.1.0
# (see docs/archive/PROVENANCE.md); new sheet-comparison layer is `sheet_solution.sheets`.
# Runtime: Python 3.11+ standard library + one pinned pure-Python PDF lib
# (fpdf2, inherited for the signable dossier). No network at runtime.
#
# The distribution is named `assay`; the import package stays `sheet_solution`
# so the module entry point (`python -m sheet_solution`) and existing scripts
# keep working.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assay"
version = "0.4.0"
description = "Forensic, offline sheet verification: deterministic checks, hash-chained evidence, human attestation. No network, no model in the check path, PII stays local."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Hatem Shalaby" }]
dependencies = [
    "fpdf2==2.8.8",   # pinned pure-Python PDF library (inherited spine)
    "defusedxml==0.7.1",  # hardened XML for the DOCX questionnaire parser
]

[project.optional-dependencies]
xlsx = ["openpyxl==3.1.5"]
gui = ["flask==3.1.3"]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "fpdf2==2.8.8",
    "openpyxl==3.1.5",
    "pillow==13.0.0",
]

[project.scripts]
assay = "sheet_solution.cli:main"

[project.urls]
Homepage = "https://github.com/Hatemshalaby15071979/Assay"
Repository = "https://github.com/Hatemshalaby15071979/Assay"
Issues = "https://github.com/Hatemshalaby15071979/Assay/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

# The GUI ships its single-page app as package data so `import sheet_solution.gui`
# can find index.html next to main.py inside the installed wheel.
[tool.setuptools.package-data]
"sheet_solution.gui" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/sheet_solution"]
