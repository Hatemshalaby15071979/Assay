name: CI

# Verification gate only — a green run is not a release decision. The dated
# release record and finding register live in RELEASE_READINESS.md.
#
# Assay is offline-by-construction; this also builds the Docker
# image and runs it under `--network none` to prove the guarantee.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned dev dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.python-version }}" = "3.11" ]; then
            python -m pip install --require-hashes -r requirements.lock
          else
            # The hash lock targets CPython 3.11 (the Docker image); install
            # the same pinned versions unpinned on other interpreters.
            python -m pip install "fpdf2==2.8.8" "defusedxml==0.7.1" "openpyxl==3.1.5"
          fi
          python -m pip install "pytest==9.1.1" "pytest-cov==7.1.0" \
                                "openpyxl==3.1.5" "pillow==13.0.0"

      - name: Scaffold + offline + doc-consistency
        run: |
          python scripts/check-scaffold.py
          python scripts/check-offline.py
          python scripts/check-doc-consistency.py

      - name: GUI import lint (installable via the [gui] extra)
        run: |
          python -m pip install -e ".[gui]"
          python -c "import sheet_solution.gui.main; print('gui import OK')"

      - name: GUI smoke test (live Flask server + POSTs)
        run: python scripts/gui-smoke-test.py

      - name: Test suite (inherited spine + new sheet layer)
        run: PYTHONPATH=src python -m pytest --cov=src/sheet_solution -q

  determinism:
    name: Determinism + scale smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install "pytest==9.1.1" "openpyxl==3.1.5" "pillow==13.0.0"

      - name: Determinism check
        run: PYTHONPATH=src python scripts/check-determinism.py --out out/determinism

      - name: Bounded scale smoke
        run: PYTHONPATH=src python scripts/scale-stress.py --rows 2000

  docker:
    name: Docker (offline proof)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t assay:ci .

      - name: Run the sheet audit inside the image, fully offline
        run: |
          # The container starts as root so the entrypoint can chown the /out
          # volume (docker creates named volumes root-owned; a non-root user
          # cannot chown them), then drops to sheetsol via runuser for the
          # workload. The workload itself still runs non-root.
          docker run --rm --network none --read-only \
            -v "$PWD/examples:/data:ro" \
            -v ss-ci-out:/out \
            assay:ci run \
              --sheet /data/example-sheet.xlsx \
              --template /data/check-template.example.txt \
              --out /out/report
          docker run --rm --network none \
            -v ss-ci-out:/out:ro \
            assay:ci verify --out /out/report

  prerelease:
    name: Prerelease image (assay:0.4.0)
    needs: [test, determinism, docker, browser, package, security, docs_consistency]
    runs-on: ubuntu-latest
    # Only publish the pinned prerelease tag on a tag push or manual dispatch;
    # never on a branch push. Staged to the prerelease channel until 1.0.
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v0.') }}
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build prerelease image
        run: docker build -t "assay:${{ steps.tag.outputs.TAG }}" -t "assay:0.4.0" .

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push prerelease image
        run: |
          docker push "ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.TAG }}"
          docker push "ghcr.io/${{ github.repository }}:0.4.0"

  browser:
    name: Browser regression (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install "pytest==9.1.1" "openpyxl==3.1.5" \
                                "pillow==13.0.0" "flask==3.0.3"

      - name: Install Chromium for Playwright
        run: npx playwright install chromium --with-deps

      - name: Run the GUI browser regression test
        run: bash tests/gui-browser-test.sh
        env:
          CHROME: /usr/bin/google-chrome
          PORT: "8600"

      - name: Run the GUI decision-loop E2E (deny -> alternatives -> apply)
        run: bash tests/gui-decisions-test.sh
        env:
          CHROME: /usr/bin/google-chrome
          PORT: "8601"

  package:
    name: Package (wheel + clean install + SBOM)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install setuptools==78.1.1 wheel==0.46.3 build==1.2.2.post1

      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build wheel
        run: python -m build --wheel --no-isolation

      - name: Verify wheel is non-empty
        run: |
          python - <<'PY'
          import glob
          import sys
          import zipfile

          wheels = glob.glob("dist/*.whl")
          if not wheels:
              print("FAIL: no wheel produced")
              sys.exit(1)
          z = zipfile.ZipFile(wheels[0])
          mods = [n for n in z.namelist() if n.startswith("sheet_solution/") and n.endswith(".py")]
          print(f"Wheel {wheels[0]} contains {len(mods)} sheet_solution modules")
          if not mods:
              print("FAIL: wheel contains no sheet_solution modules")
              sys.exit(1)
          PY

      - name: Install into clean venv + CLI smoke
        run: |
          python -m venv /tmp/ss-venv
          /tmp/ss-venv/bin/pip install --require-hashes -r requirements.lock
          /tmp/ss-venv/bin/pip install --no-deps dist/*.whl
          /tmp/ss-venv/bin/assay --help
          /tmp/ss-venv/bin/python -m sheet_solution --help

      - name: Generate runtime SBOM
        run: |
          python -m venv /tmp/ss-sbom
          /tmp/ss-sbom/bin/pip install cyclonedx-bom==7.6.0
          /tmp/ss-sbom/bin/cyclonedx-py environment /tmp/ss-venv \
            --pyproject pyproject.toml \
            --output-reproducible \
            --output-file /tmp/assay-runtime.cdx.json
          python - <<'PY'
          import json
          from pathlib import Path

          bom = json.loads(Path("/tmp/assay-runtime.cdx.json").read_text())
          names = {
              item["name"].lower().replace("_", "-")
              for item in bom.get("components", [])
          }
          root = bom.get("metadata", {}).get("component", {})
          if root.get("name"):
              names.add(root["name"].lower().replace("_", "-"))
          required = {"assay", "fpdf2", "openpyxl", "pillow", "defusedxml"}
          missing = required - names
          if missing:
              raise SystemExit(f"SBOM is missing runtime components: {sorted(missing)}")
          print(f"Runtime SBOM contains {len(names)} components")
          PY

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scanners
        run: pip install bandit==1.9.4 pip-audit==2.10.1

      - name: Run bandit on source
        run: bandit -r src -q

      - name: Audit locked runtime dependencies
        run: pip-audit -r requirements.lock

      - name: Secret scan (pattern check)
        run: |
          if grep -rniE "(sk_live_[A-Za-z0-9]{16,}|sk_test_[A-Za-z0-9]{16,}|sk-(proj-)?[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{40,}|xox[baprs]-[A-Za-z0-9-]{10,}|service_role[=:[:space:]]+eyJ[A-Za-z0-9._-]{20,}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----)" \
            src tests examples docs scripts tooling --exclude-dir=__pycache__; then
            echo "FAIL: potential secret found"; exit 1
          else
            echo "No hardcoded secrets detected"
          fi

      - name: Scan every reachable commit for secrets
        run: python3 tooling/security/scan_history_secrets.py --json history-secret-scan.json

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-secret-scan
          path: history-secret-scan.json

  docs_consistency:
    name: Version and status consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check version, Python floor and status claims
        run: python3 scripts/check-doc-consistency.py

  gate:
    name: Release gate
    needs: [test, determinism, docker, browser, package, security, docs_consistency]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All CI stages green — CI workflow passed"
        if: always() && needs.test.result == 'success' && needs.determinism.result == 'success' && needs.docker.result == 'success' && needs.browser.result == 'success' && needs.package.result == 'success' && needs.security.result == 'success' && needs.docs_consistency.result == 'success'
